[project]
name = "libreoffice-mcp"
version = "2.0.0a1"
description = "MCP server that lets AI agents create and edit LibreOffice documents (Writer first; Calc and Impress next)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
libreoffice-mcp = "libreoffice_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libreoffice_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["office: needs a real LibreOffice installation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "RUF012"]  # the formatter owns line length
